name: Play release

# Builds the signed Android App Bundle (.aab) that Google Play needs, plus the R8 mapping file
# for readable crash reports. Run it from Actions → Play release → Run workflow, then upload
# the bundle in Play Console (Testing → Internal testing → Create release).
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   STEPQ_KEYSTORE_BASE64    the upload keystore (.jks), base64-encoded: `base64 -w0 upload.jks`
#   STEPQ_KEYSTORE_PASSWORD  its password
#   STEPQ_KEY_ALIAS          the key alias (usually "upload")
#   STEPQ_KEY_PASSWORD       the key password (often the same as the keystore's)
#   SUPABASE_ANON_KEY        the public anon / publishable key (never the service key)
#   GOOGLE_SERVICES_JSON     optional: Firebase config, for push and crash reports
# and the variables SUPABASE_URL and GOOGLE_WEB_CLIENT_ID.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version shown on Play (e.g. 1.0.0)
        required: true
        default: 1.0.0

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 37 platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: Upload key and Firebase config
        env:
          STEPQ_KEYSTORE_BASE64: ${{ secrets.STEPQ_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$STEPQ_KEYSTORE_BASE64" ]; then echo "::error::Set the STEPQ_KEYSTORE_BASE64 secret first"; exit 1; fi
          printf %s "$STEPQ_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "STEPQ_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf %s "$GOOGLE_SERVICES_JSON" > app/google-services.json; fi
      - name: Build the signed bundle
        env:
          STEPQ_KEYSTORE_PASSWORD: ${{ secrets.STEPQ_KEYSTORE_PASSWORD }}
          STEPQ_KEY_ALIAS: ${{ secrets.STEPQ_KEY_ALIAS }}
          STEPQ_KEY_PASSWORD: ${{ secrets.STEPQ_KEY_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          # Every run gets a higher version code than the last, as Play requires.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then echo "::error::Set the SUPABASE_ANON_KEY secret first"; exit 1; fi
          ./gradlew bundleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: stepq-${{ inputs.version_name }}-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" app/google-services.json
