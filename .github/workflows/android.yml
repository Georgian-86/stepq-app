name: Android

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 37 platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: Build, unit tests, lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --console=plain
      - name: Screenshots
        run: ./gradlew recordRoborazziDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-and-reports
          path: |
            app/build/outputs/roborazzi/
            app/build/reports/
          retention-days: 14
