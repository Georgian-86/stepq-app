name: Android

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 37 platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: Build, unit tests, lint
        env:
          # Public anon key and project URL, from repo Settings → Secrets / Variables → Actions.
          # Without them the APK still builds; log-in then says it isn't configured.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --console=plain
      - name: Preview APK
        uses: actions/upload-artifact@v4
        with:
          name: stepq-preview-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Screenshots
        run: ./gradlew recordRoborazziDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-and-reports
          path: |
            app/build/outputs/roborazzi/
            app/build/reports/
          retention-days: 14

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway CI database: no password, local connections trusted.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migrations and RLS checks
        run: ./supabase/tests/run.sh
