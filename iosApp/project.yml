# XcodeGen spec for the StepQ iOS app. Generate the Xcode project with `xcodegen` (see README.md);
# StepQ.xcodeproj itself is not committed.
name: StepQ
options:
  bundleIdPrefix: in.stepq
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/StepQ.xcconfig
  Release: Config/StepQ.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # iPhone only. StepQ is a phone app (steps come from the iPhone and Apple Watch).
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    # The shared Kotlin framework is built for arm64 only (iPhones and Apple-silicon simulators).
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  StepQ:
    type: application
    platform: iOS
    sources:
      - path: StepQ
        excludes:
          - "**/*.md"
      - path: StepQ.storekit
        buildPhase: none
    entitlements:
      path: StepQ/StepQ.entitlements
      properties:
        # Steps, distance, active energy and exercise minutes from Apple Health. Read only.
        com.apple.developer.healthkit: true
        com.apple.developer.applesignin: [Default]
    info:
      path: StepQ/Info.plist
      properties:
        CFBundleDisplayName: StepQ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
          UIImageName: piko-happy
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts:
          - fredoka_500.ttf
          - fredoka_600.ttf
          - nunito_400.ttf
          - nunito_700.ttf
          - nunito_800.ttf
        # Only standard HTTPS (Supabase, stepq.in): exempt from export documentation.
        ITSAppUsesNonExemptEncryption: false
        # Purpose string shown by iOS before Apple Health access. Apple reviews this text.
        NSHealthShareUsageDescription: "StepQ reads your steps, walking distance, active energy and exercise minutes from Apple Health to show your daily progress, keep your streaks and rank you in challenges. Your daily totals are saved to your StepQ account and shown to the friends you add. StepQ never uses health data for advertising and never sells it."
        CFBundleURLTypes:
          - CFBundleURLName: in.stepq.app.auth
            CFBundleURLSchemes: [stepq]
        # Supabase settings, from Config/StepQ.xcconfig and Config/Secrets.xcconfig.
        SupabaseHost: $(SUPABASE_HOST)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        SiteURL: https://stepq.in
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.stepq.app
        PRODUCT_NAME: StepQ
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [$(inherited), -framework, Shared]
    preBuildScripts:
      - name: Build the shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "${OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED}" = "YES" ]; then exit 0; fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode --console=plain
    scheme:
      storeKitConfiguration: StepQ.storekit
schemes:
  StepQ:
    build:
      targets:
        StepQ: all
    run:
      config: Debug
      storeKitConfiguration: StepQ.storekit
    archive:
      config: Release
